<!doctype html>

<head>

<style>
:root{--y:#ffe600;--bg:#0a0a0a;--card:#161616;--card2:#202020;--tx:#fff;--mut:#a8a8a8;--ok:#22c55e;--bad:#ef4444;--cy:#22d3ee;--pk:#ff4d8d;--pu:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(circle at 15% 0%,rgba(255,230,0,.10),transparent 40%),radial-gradient(circle at 90% 30%,rgba(34,211,238,.07),transparent 40%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--y);display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{font-family:'Lalezar',cursive;color:var(--y);font-size:22px;flex:1;cursor:pointer;line-height:1}
.chip{background:var(--card2);border:1px solid #333;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.chip.y{color:var(--y);border-color:var(--y)}
.xb{background:#5b1111;color:#fff;border:1px solid #ef4444;border-radius:99px;padding:8px 14px;font-family:Cairo;font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap}
.ib{background:var(--card2);color:#fff;border-radius:50%;width:36px;height:36px;font-size:17px;border:1px solid #333}
main{max-width:760px;margin:0 auto;padding:14px 14px 80px}
.hero{text-align:center;margin:-14px -14px 0;padding:0}.unit{margin:10px 14px}
.logo{width:100%}.logo img{width:100%;max-width:none;height:auto;display:block;border-radius:0}
.logotxt{font-family:'Lalezar',cursive;color:var(--y);font-size:68px;line-height:1;text-shadow:0 0 28px rgba(255,230,0,.35);transform:rotate(-3deg)}
.unit{margin:14px auto 0;display:inline-block;background:var(--y);color:#000;font-weight:900;border-radius:12px;padding:6px 16px;font-size:15px}
.teacher{background:linear-gradient(135deg,#1a1a1a,#111);border:1px solid #2d2d2d;border-radius:18px;padding:14px;margin:14px 0;text-align:center}
.teacher b{color:var(--y);font-size:20px;font-family:'Lalezar'}
.teacher p{margin:4px 0 10px;color:#ddd;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--y);color:#000;font-weight:900;font-size:16px;border-radius:14px;padding:11px 20px;box-shadow:0 4px 0 #b3a100;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b3a100}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 4px 0 #168a43;text-decoration:none}
.btn.pk{background:var(--pk);color:#fff;box-shadow:0 4px 0 #b02f62}
.btn.gh{background:var(--card2);color:#fff;box-shadow:0 4px 0 #000;border:1px solid #333}
.btn.big{width:100%;font-size:18px;padding:14px}
.hide{display:none!important}
h2.sec{font-family:'Lalezar';font-size:24px;color:var(--y);margin:20px 0 10px}
.lcards{display:grid;gap:12px}
.lc{background:var(--card);border:2px solid #2a2a2a;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.lc:hover{border-color:var(--y);transform:translateY(-2px)}
.lc .n{font-family:'Lalezar';font-size:34px;background:var(--y);color:#000;border-radius:14px;width:54px;height:54px;display:grid;place-items:center;flex:none}
.lc .tt{font-weight:900;font-size:16px;line-height:1.5}
.lc .sub{color:var(--mut);font-size:12px;margin-top:2px}
.bar{height:10px;border-radius:99px;background:#2b2b2b;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ok));border-radius:99px;transition:width .6s}
.jcard{background:linear-gradient(135deg,#3b0a2a,#1a1a1a);border:2px solid var(--pk);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;margin-top:16px}
.jcard .e{font-size:40px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tab{flex:1;white-space:nowrap;background:var(--card2);color:#ddd;border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px;border:1px solid #333}
.tab.on{background:var(--y);color:#000;border-color:var(--y)}
.back{background:none;color:var(--y);font-weight:700;font-size:15px;padding:6px 0}
.ltitle{font-family:'Lalezar';font-size:26px;line-height:1.3;margin:4px 0}
.path{position:relative;margin:16px 0;padding-right:0}
.st{display:flex;gap:12px;align-items:center;margin-bottom:6px;cursor:pointer}
.st .nd{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--card2);border:3px solid #444;flex:none;position:relative;z-index:1}
.st.done .nd{background:var(--ok);border-color:#86efac}
.st.open .nd{background:var(--y);border-color:#fff3a0;animation:pulse 1.6s infinite}
.st.lock{opacity:.55}
.st .bx{flex:1;background:var(--card);border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
.st .bx b{display:block;font-size:15px}
.st .bx span{font-size:12px;color:var(--mut)}
.conn{width:4px;height:22px;background:#333;margin:0 29px 6px 0;border-radius:2px}
.conn.g{background:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,230,0,.6)}50%{box-shadow:0 0 0 12px rgba(255,230,0,0)}}

.qtp{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;flex-wrap:wrap;font-size:14px}
.qtp button{background:var(--card);color:#fff;border:2px solid #444;border-radius:20px;padding:6px 14px;font-family:inherit;font-weight:700;cursor:pointer}
.qtp button.on{background:var(--y);color:#000;border-color:var(--y)}
.nbk{margin:14px 0;border-radius:6px 14px 14px 6px;position:relative;color:#1a2a6c;font-family:'Aref Ruqaa','Cairo',serif;
 background:#fffef5 repeating-linear-gradient(transparent 0,transparent 35px,#9ec5ee 35px,#9ec5ee 36px);background-position:0 12px;
 padding:14px 20px 14px 18px;padding-right:58px;box-shadow:0 4px 14px rgba(0,0,0,.5);border-right:3px solid #e8737a;line-height:36px}
.nbk:before{content:'';position:absolute;right:40px;top:0;bottom:0;width:2px;background:#e8737a;opacity:.7}
.nbk:after{content:'';position:absolute;right:10px;top:14px;bottom:14px;width:12px;background:radial-gradient(circle,#0f0f14 5px,transparent 6px) 0 0/12px 40px repeat-y}
.nbk .nt{font-weight:700;font-size:21px;color:#b3261e;line-height:36px;margin-bottom:0;text-decoration:underline wavy #f0a;text-underline-offset:6px}
.nbk ul{margin:0;padding:0 18px 0 0;list-style:none}
.nbk li{font-size:19px;line-height:36px;position:relative}
.nbk li:before{content:'✎';position:absolute;right:-20px;color:#e8737a;font-size:14px}
.nbk .no{position:absolute;left:10px;top:6px;background:#ffe600;color:#000;font-family:Cairo;font-weight:900;font-size:12px;line-height:1;padding:4px 8px;border-radius:10px;transform:rotate(-4deg)}
.nbk .acts{display:flex;gap:8px;margin:10px 0 2px;line-height:1.2;flex-wrap:wrap}
.nbk .acts button{flex:1;min-width:140px;border:0;border-radius:12px;padding:12px;font-family:Cairo;font-weight:900;font-size:15px;cursor:pointer}
.nbk .acts .y{background:#16a34a;color:#fff}.nbk .acts .n{background:#fff;color:#b3261e;border:2px dashed #b3261e}
.nbk.cl{height:auto;cursor:pointer;line-height:1.4;padding-top:12px;padding-bottom:12px;background:#f4f1dc}
.nbk.cl .nt{font-size:18px;line-height:1.4;text-decoration:none}
.nbk.cl small{display:block;font-family:Cairo;color:#16a34a;font-weight:700}
.nbk.lk{filter:grayscale(.9) brightness(.55);cursor:not-allowed;line-height:1.4;background:#d9d6c3;padding-top:12px;padding-bottom:12px}
.nbk.lk .nt{text-decoration:none;color:#555;font-size:18px;line-height:1.4}
.nbk.cur{box-shadow:0 0 0 3px #ffe600,0 6px 22px rgba(255,230,0,.35)}

.timer .kn{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #ffe600;box-shadow:0 0 10px #ffe600;transform:translate(50%,-50%);transition:right .1s linear;z-index:2}
.timer.xl{height:34px}.timer.xl span{font-size:20px;letter-spacing:1px}
.timer.low .kn{border-color:#ef4444;box-shadow:0 0 12px #ef4444}
.crown{font-size:84px;animation:pop .8s both,float 2.2s ease-in-out infinite .8s;filter:drop-shadow(0 0 18px rgba(255,230,0,.7))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{0%{background-position:0 0}100%{background-position:200% 0}}
.rank{display:inline-block;font-family:'Lalezar';font-size:30px;padding:6px 22px;border-radius:99px;color:#000;background:linear-gradient(90deg,#ffe600,#fff7a8,#ffe600,#f59e0b,#ffe600);background-size:200% 100%;animation:shine 3s linear infinite;margin:6px 0}
.medal{font-size:20px;font-weight:900;margin:4px 0}
.qt{margin:14px 0;padding:14px;border-radius:16px;background:#14110a;border:2px solid #b8860b;line-height:2;font-family:'Aref Ruqaa','Cairo',serif;font-size:21px;color:#fff3c4}
.qt small{display:block;font-family:Cairo;font-size:13px;color:#d9b24c;margin-top:2px}
.brd{margin:12px 0}
.brw{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #2a2a33;font-size:14px}
.brw .nm{flex:1;line-height:1.5;font-weight:700}
.brw .nm small{display:block;color:#a8a8a8;font-weight:400}
.brw .pc{min-width:50px;text-align:center;font-weight:900;border-radius:10px;padding:4px 6px}
.brw .pc.g{background:#14532d;color:#86efac}.brw .pc.m{background:#4a3b00;color:#ffe600}.brw .pc.b{background:#5b1111;color:#fca5a5}.brw .pc.z{background:#222;color:#888}
.brw button{background:var(--y);color:#000;border:0;border-radius:10px;padding:7px 10px;font-family:Cairo;font-weight:900;cursor:pointer;font-size:13px}
.brw button.d{background:#333;color:#888;cursor:not-allowed}
.exg{display:grid;gap:12px}
#hpts{cursor:pointer}

.dly{margin-top:16px;border-radius:20px;padding:16px;background:linear-gradient(135deg,#2b2200,#3b0a2a);border:2px solid var(--y);box-shadow:0 0 22px rgba(255,230,0,.2)}
.dly .dh{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.dly .btn{margin-top:6px}
textarea::placeholder{color:#777}
.sweets{display:grid;gap:10px}
.sweet{background:var(--card);border:2px dashed var(--pk);border-radius:16px;padding:14px;cursor:pointer}
.sweet .h{font-weight:900;font-size:16px}
.sweet .b{display:none;margin-top:8px;color:#ffe9a8;line-height:1.9}
.sweet.open{border-style:solid;background:#241020}
.sweet.open .b{display:block}
.box{background:var(--card);border:1px solid #2d2d2d;border-radius:16px;padding:14px;margin:10px 0}
.qwrap{padding-top:4px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.qtop .tl{font-weight:900;font-size:14px;color:var(--y);text-align:center;flex:1}
.dots{display:flex;gap:4px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:9px;background:#333}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--y)}
.timer{position:relative;height:26px;background:#222;border-radius:99px;overflow:hidden;border:1px solid #333}
.timer i{position:absolute;inset:0 0 0 auto;width:100%;background:var(--ok);transition:width .1s linear,background .3s}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;text-shadow:0 1px 2px #000}
.timer.low{animation:shake .4s infinite}
.qtext{background:var(--card);border:2px solid var(--y);border-radius:18px;padding:18px 14px;margin:12px 0;font-weight:900;font-size:19px;line-height:1.8;text-align:center}
.opts{display:grid;gap:10px}
.op{background:var(--card2);color:#fff;border:2px solid #3a3a3a;border-radius:14px;padding:13px 12px;font-weight:700;font-size:16px;text-align:right;display:flex;gap:10px;align-items:center;line-height:1.6;transition:.12s}
.op:active{transform:scale(.98)}
.op .l{background:#333;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none;font-size:13px}
.op.right{background:#14532d;border-color:var(--ok);animation:pop .4s}
.op.wrong{background:#5b1111;border-color:var(--bad);animation:shake .4s}
.op.sel{border-color:var(--y);background:#2a2600}
.op:disabled{cursor:default}
.fb{min-height:54px;margin:12px 0 6px;text-align:center;font-weight:900;font-size:17px;line-height:1.7}
.fb small{display:block;color:var(--y);font-size:15px}
.gap{display:inline-block;min-width:90px;border-bottom:3px dashed var(--y);color:var(--y);padding:0 6px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.cp{background:var(--card2);color:#fff;border:2px solid #444;border-radius:99px;padding:9px 16px;font-weight:700;font-size:15px}
.cp.used{opacity:.3;pointer-events:none}
.cp.bad{animation:shake .4s;border-color:var(--bad)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .cl{display:grid;gap:8px;align-content:start}
.mc{background:var(--card2);color:#fff;border:2px solid #444;border-radius:12px;padding:10px 8px;font-size:14px;font-weight:700;line-height:1.5}
.mc.sel{border-color:var(--y);background:#2a2600}
.mc.ok{background:#14532d;border-color:var(--ok);pointer-events:none}
.mc.bad{animation:shake .4s;border-color:var(--bad)}
.ordr{display:grid;gap:8px;margin-top:10px}
.slot{border:2px dashed #444;border-radius:12px;padding:10px;min-height:44px;font-weight:700;font-size:14px}
.slot.f{border-style:solid;border-color:var(--ok);background:#0f2d1a}
.res{text-align:center;padding-top:10px}
.res .big{font-family:'Lalezar';font-size:64px;color:var(--y);line-height:1.1}
.stars{font-size:44px;letter-spacing:6px}
.rrow{display:flex;gap:8px;justify-content:center;margin:10px 0}
.rrow .chip{font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:60;display:grid;place-items:center;padding:16px}
.md{background:var(--card);border:2px solid var(--y);border-radius:20px;padding:18px;max-width:420px;width:100%;text-align:center}
.md input{width:100%;font-family:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid #444;background:#0f0f0f;color:#fff;text-align:center;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--y);color:#000;font-weight:900;padding:10px 18px;border-radius:99px;z-index:90;max-width:92%;text-align:center;animation:pop .3s}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:80;animation:fall linear forwards;pointer-events:none}
.rv{border-right:4px solid var(--bad);padding:6px 10px;margin:8px 0;background:#1a1010;border-radius:8px;font-size:14px;line-height:1.7;text-align:right}
.rv em{color:var(--ok);font-style:normal;font-weight:900}
.glog{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid #2d2d2d;border-radius:12px;padding:10px;margin:8px 0;font-size:14px;align-items:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ipop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;display:flex;align-items:center;justify-content:center;padding:18px}
.ipop .bx{background:var(--card);border:2px solid var(--y);border-radius:20px;max-width:360px;width:100%;padding:22px 18px;text-align:center;animation:pop .35s}
.ipop .ic{font-size:46px}.ipop h3{font-family:'Lalezar',cursive;color:var(--y);font-size:26px;margin:6px 0}
.ipop p{color:#ddd;font-size:15px;line-height:1.8;margin:6px 0 14px}.ipop .st{background:var(--card2);border-radius:12px;padding:10px;font-size:14px;line-height:1.9;text-align:right;margin-bottom:14px}
.ipop .lt{display:block;margin:12px auto 0;color:var(--mut);font-size:14px;text-decoration:underline}
</style>
</head>

var SWC={"1": [{"t": "نشأة الدولة وأركانها", "b": ["قامت على ضفاف نهر النيل واحدة من أعظم الحضارات وأول دولة مركزية عرفتها البشرية.", "الدولة هي وحدة سياسية تشغل حيزًا جغرافيًا محددًا وتضم شعبًا وسلطة وسيادة.", "الأركان الرئيسية الأربعة للدولة هي: الشعب، الحيز الجغرافي، السلطة، والسيادة.", "تنص المادة الأولى من الدستور على أن جمهورية مصر العربية دولة ذات سيادة موحدة لا تقبل التجزئة."]}, {"t": "ركن الشعب وأدواره", "b": ["الشعب يشمل جميع المواطنين المقيمين داخل حدود الدولة أو خارجها ممن يحملون الجنسية المصرية.", "تتم المشاركة السياسية للشعب عبر انتخاب الحكام وممثلي مجلس النواب ومراقبة أداء الحكومة.", "يدعم الشعب أمن الدولة بالالتزام بالدستور والقوانين المختلفة واحترامها.", "يساهم الشعب في التنمية الاقتصادية بالعمل والإنتاج ودفع الضرائب لتمويل المشروعات العامة.", "يحافظ الشعب على هوية المجتمع بحماية التراث المادي والثقافي واحترام العادات والتقاليد.", "يدافع الشعب عن الوطن بمساندة القوات المسلحة والمشاركة التطوعية وقت الأزمات.", "أثبتت ثورة 1919م أن الشعب هو القوة الحقيقية للتغيير وبقاء الدولة وتطوير نظامها السياسي."]}, {"t": "الحيز الجغرافي وحدود مصر", "b": ["الحيز الجغرافي هو الرقعة المحددة التي تشمل اليابس والمياه الإقليمية والمجال الجوي.", "حدود مصر تعتبر من أكثر الحدود ثباتًا واستقرارًا عبر التاريخ.", "يحد مصر جنوبًا خط عرض 22 درجة شمالاً والمحرر عام 1899م ليفصل بين مصر والسودان.", "يحد مصر شمالاً خط ساحل البحر المتوسط.", "يحد مصر شرقًا خط ساحل البحر الأحمر وخليج العقبة والحدود البرية مع فلسطين الرسمية عام 1906م.", "يحد مصر غربًا خط طول 25 درجة شرقًا والمحرر عام 1925م ليفصل بين مصر وليبيا.", "المياه الإقليمية هي المساحات البحرية التي تمتد لمسافة 12 ميلاً بحريًا من خط الساحل الأساسي.", "المجال الجوي هو المساحة الرأسية التي تعلو اليابس والمياه الإقليمية للدولة."]}, {"t": "ركن السلطة", "b": ["السلطة تشمل المؤسسات التي تدير شئون الدولة وتضع القوانين وتنفذها وتحافظ على الأمن.", "تنقسم سلطات الدولة إلى ثلاث: السلطة التشريعية، السلطة التنفيذية، والسلطة القضائية.", "يتولى مجلس النواب سلطة التشريع وإقرار السياسة العامة والخطة والموازنة والرقابة (مادة 101).", "رئيس الجمهورية على استمرار الجاهزية القتالية.", "تولى كامس الحكم وعمل على تغيير العقيدة العسكرية من الدفاع إلى الهجوم.", "تميزت إدارة كامس للمرحلة الثانية بإعادة الهيكلة والتنظيم الداخلي للمؤسسة العسكرية.", "استهدف توجه الملك كامس شمالاً حرمان العدو من استعادة التوازن السياسي والعسكري.", "ارتكزت الخطة الاستراتيجية لكامس على عزل العدو جغرافياً وسلبه حلفاءه في الجنوب.", "لعب الحصار الاقتصادي وقطع خطوط الإمداد دوراً محورياً في إضعاف القدرات القتالية للهكسوس.", "تؤكد نهاية المرحلة الثانية على مبدأ تراكم الخبرات الاستراتيجية والتكامل بين القادة لتأمين النصر الحاسم.", "يستدل من لوحة كامس التاريخية على إدراكه لخطورة التهديد المتزامن للأمن القومي من جهتين (الشمالية والجنوبية)."]}, {"t": "نواتج تعلم الدرس الثاني (3): كامس وأحمس", "b": ["تمثلت الخطوة الأولى لتحقيق السيادة الوطنية عند كامس في رفض واقع التشرذم والتفتيت السياسي لمصر.", "يُعزى وصف كامس بـ «مهندس النصر» إلى وضعه الخطط التمهيدية لمواجهة العدو.", "كشفت اللوحة التاريخية لكامس عن عمق الأزمة السياسية في مصر المتمثلة في غياب الوحدة المركزية للبلاد.", "ارتبط تحقيق الاستقلال الوطني الشامل بالقدرة على القضاء على التهديدات الخارجية وتأمين الحدود الجغرافية للبلاد.", "نجح أحمس في تحقيق الاستقرار عبر الموائمة السياسية والاحتواء الذكي للقوى المحلية (حكام الأقاليم).", "تمثلت نقطة التحول في العقيدة العسكرية المصرية بعد طرد الهكسوس في الانتقال من الدفاع إلى بناء العمق الاستراتيجي (الإمبراطورية).", "تؤكد ملاحقة أحمس للهكسوس خارج الحدود على تبني مصر استراتيجية «الأمن القومي الممتد» وتأمين المداخل الحيوية.", "يستدل من استكمال أحمس لمسيرة عائلته على مبدأ «تراكمية العمل العسكري» وتحقيق الأهداف الاستراتيجية المؤجلة.", "تحولت الأزمة الكبرى للاحتلال إلى حافز تاريخي للتطوير النوعي للسلاح المصري (العجلات الحربية)."]}, {"t": "نواتج تعلم الدرس الثاني (4): الفرس", "b": ["ارتبط نجاح الغزو الخارجي لمصر في العصر المتأخر بحالة التفكك السياسي وغياب الجبهة الداخلية الموحدة.", "شكل الاضطراب السياسي والصراع الداخلي بمصر ثغرة استراتيجية حفزت الأطماع التوسعية للقوى الإقليمية المجاورة.", "يستدل من سقوط مصر عام 525 ق.م على اختلال ميزان القوى العسكرية بين الجيش المصري والإمبراطورية الفارسية الناشئة.", "ترتب على هزيمة الملك أبسماتيك الثالث زوال السيادة الوطنية وبداية حقبة من التبعية السياسية للاحتلال الأجنبي.", "يؤكد تلازم «الاضطراب الداخلي» مع «الأطماع الخارجية» على أن الأمن القومي للدولة يبدأ من استقرارها السياسي.", "تؤكد حركات المقاومة ضد الفرس على حيوية الشعب المصري ورفضه الاستسلام لواقع سلب السيادة الوطنية.", "تمثل الهدف الأسمى والدافع المحرك لثورات المصريين ضد الفرس في استرداد الحرية والشرعية السياسية للبلاد.", "يستدل من استمرار الثورات رغم امتلاك المجتمع المصري مناعة حضارية تحول دون ذوبانه في المحتل.", "يكشف التمسك بالهوية الحضارية أثناء الغزو الفارسي عن عمق الوعي القومي ومناهضة التبعية للأجنبي.", "ساعدت السياسة المالية المستبدة للاحتلال الفارسي في تهيئة المناخ لتبدل الولاء السياسي للمصريين."]}, {"t": "نواتج تعلم الدرس الثاني (5): الإسكندر", "b": ["شكل الاستبداد الفارسي ثغرة نفسية وسياسية استغلها الإسكندر الأكبر لتسهيل دخوله إلى مصر دون مقاومة تذكر.", "يرجع تقبل المصريين للقوى الخارجية الوافدة (الإسكندر) إلى الرغبة في التخلص من الاضطهاد وسوء المعاملة من السلطة القائمة.", "يستدل من ترحيب المصريين بالإسكندر على أن الضغط الاقتصادي والظلم الاجتماعي يولدان بيئة خصبة للتغيير السياسي.", "عكس غياب المقاومة المصرية للإسكندر رغبة المجتمع في توظيف القوى الخارجية للخلاص من القمع والاضطهاد الفارسي.", "فطن الإسكندر الأكبر مبكراً إلى أن استقرار الحكم السياسي يتطلب احترام الخصوصية العقائدية والموروث الثقافي للشعوب.", "ارتكزت استراتيجية تثبيت النفوذ عند الإسكندر على اكتساب الشرعية الدينية لتفادي تكلفة الصراع العسكري المباشر.", "جاء تأسيس مدينة الإسكندرية كأداة استراتيجية متعددة الأبعاد تجمع بين الهيمنة العسكرية، والريادة الاقتصادية.", "شكل بناء الإسكندرية نقطة تحول تاريخية نقلت العلاقات المصرية الإغريقية من مرحلة الوفود المؤقتة إلى مرحلة الاندماج والتبعية السياسية."]}, {"t": "نواتج تعلم الدرس الثاني (6): البطالمة", "b": ["شكل غياب الوريث الشرعي والوصية السياسية للإسكندر الأكبر ثغرة استراتيجية أدت لتفكك وحدتها السياسية.", "تحولت ريادة الإمبراطورية المقدونية بعد وفاة قائدها من التوسع الخارجي الموحد إلى الصراع والنزاع على النفوذ.", "جاء انفراد بطلميوس بن لاجوس بحكم مصر نتيجة الفهم الدقيق لأهمية موقعها الجغرافي كملاذ آمن لتأسيس شرعية سياسية مستقلة.", "يستدل من صراع قادة جيش الإسكندر على تغليب المصالح الطموحة والشخصية على الولاء والتماسك العسكري للإمبراطورية.", "مثلت مصر بالنسبة لبطلميوس بن لاجوس نقطة الارتكاز الاستراتيجية والقاعدة الحيوية لبناء جبهة قوية في مواجهة خصومه."]}, {"t": "نواتج تعلم الدرس الثاني (7): الرومان", "b": ["تزامن صعود القوة الإمبراطورية لروما مع حالة التفتت السياسي والنزاع على السلطة داخل الأسرة البطلمية.", "شكلت الأزمات السياسية والاضطرابات الداخلية لدولة البطالمة ثغرة استراتيجية سهلت التدخل والتوسع الروماني في مصر.", "ارتبط السعي الروماني الحثيث للسيطرة على مصر بالرغبة في تأمين الأمن الغذائي لروما عبر احتكار السيطرة على مناطق إنتاج الحبوب.", "منح الموقع الجغرافي لمصر روما ميزة استراتيجية مكنتها من الإشراف والتحكم في الشرايين التجارية العالمية بين الشرق والغرب.", "أدى فقدان الإرادة السياسية والسيادة الوطنية بوفاة كليوباترا السابعة إلى تحول مصر من دولة مستقلة إلى مجرد مورد اقتصادي تابع لروما (ولاية متميزة).", "شكلت السياسات المالية المستبدة (الضرائب المحرك والشرارة الأولى) لاندلاع الثورات الوطنية ضد الإدارة الرومانية.", "تجاوزت أهداف المقاومة المصرية مجرد التخلص من الضغط الاقتصادي لتستهدف استرداد السيادة والشرعية السياسية المفقودة للبلاد.", "ارتبط رد الفعل الروماني العنيف تجاه الثورات بإدراكهم للأهمية الاستراتيجية لمصر كركيزة أساسية لحفظ الأمن القومي والاستقرار الإمبراطوري.", "تكشف استمرارية الثورات رغم البطش الروماني عن امتلاك المجتمع المصري مناعة ثقافية وأصالة حضارية.", "يستدل من تمسك المصريين بهويتهم على عمق الوعي القومي ومناهضة التبعية السياسية."]}], "3": [{"t": "التحول السياسي لمصر في العصر الوسيط", "b": ["التحول التاريخي هو عملية التغيير الجذري والتدريجي في بنية المجتمعات وأنظمتها السياسية والاقتصادية.", "شهدت مصر تحولاً سياسيًا مهمًا مع الفتح الإسلامي عام 641م وانتقلت من الحكم البيزنطي لولاية إسلامية.", "أصبحت مصر تُدار وفق النظام الإداري للخلافة خلال الراشدة والأموية والعباسية الأولى.", "ظهرت الدول المستقلة في مصر خلال العصر العباسي الثاني لضعف الخلفاء وبعد العاصمة بغداد.", "انقسمت الدول المستقلة إلى دول مستقلة مع الاعتراف بالتبعية الاسمية ودول مستقلة تماماً.", "تمثلت الدول المستقلة مع الاعتراف بالتبعية الاسمية في الدولة الطولونية والإخشيدية والأيوبية والمملوكية.", "تمثلت الدولة المستقلة تماماً في الدولة الفاطمية التي اتخذت القاهرة مركزًا لخلافة منافسة.", "اعتمد نجاح الفتح الإسلامي لمصر على السماحة الدينية والعدالة في جمع الجزية إلى جانب القوة.", "أدى ضعف السلطة المركزية للعباسيين إلى بداية الاستقلال السياسي في العصرين الطولوني والإخشيدي.", "بلغت مكانة مصر السياسية ذروتها عندما أصبحت القاهرة عاصمة الخلافة الفاطمية ومركز القرار.", "استمرت مكانة مصر القيادية في العهدين الأيوبي والمملوكي بالتصدي للصليبيين والمغول.", "أدركت الدولة العثمانية أهمية مصر وضمتها إلى حكمها عام 1517م وأطلقت عليها «درة التاج العثماني»."]}, {"t": "التحول الاجتماعي بعد الفتح الإسلامي", "b": ["تحولت مصر تدريجيًا من مجتمع متعدد اللغات إلى مجتمع يغلب عليه الطابع العربي الإسلامي.", "انتشرت اللغة العربية في مصر تدريجيًا مع إصلاحات الدولة الأموية وتعريب الدواوين.", "أصبحت اللغة العربية لغة الإدارة ثم تحولت إلى لغة العلم والثقافة لربط مصر بالعالم الإسلامي.", "شهدت مصر حركة هجرات عربية واستقرار القبائل في الفسطاط والدلتا والصعيد واختلاطهم بالسكان.", "أسهم اختلاط القبائل العربية بالسكان المحليين في نشر اللغة العربية والعادات الإسلامية.", "برزت من الجماعات العربية رجال الحكم والإدارة المشاركون في الحياة العسكرية والسياسية.", "دخل المصريون في الدين الإسلامي واندمجوا مع الهجرات العربية وعملوا في دواوين الدولة."]}, {"t": "التحول الثقافي والفكري", "b": ["لعب العلماء والفقهاء دورًا في إدارة المجتمع والسياسة بتوليهم القضاء والتعليم وتنظيم الشئون الدينية.", "شكل العلماء حلقة وصل بين الإدارة السياسية والشعب لضمان الاستقرار وفق مبادئ الشريعة.", "أسهم العلماء في نشر التعليم الديني وترسيخ الهوية الإسلامية وبناء القاعدة العلمية.", "مثل مسجد عمرو بن العاص البداية التاريخية للتعليم ونشر العلوم الدينية في مصر الإسلامية.", "كان الأزهر الشريف منارة لتدريس الفقه واللغة والعلوم الشرعية وإعداد العلماء والقضاة.", "ربطت المؤسسات التعليمية والدينية مصر بالمراكز الثقافية وتبادل العلوم في العالم الإسلامي.", "شهدت مصر نشاطًا علميًا في الفقه والفلسفة والطب والتاريخ والعلوم الطبيعية.", "نقلت حركة الترجمة علوم الحضارات القديمة اليونانية والفارسية والهندية إلى الثقافة العربية.", "أسهمت الترجمة في تطوير الفكر العلمي والفلسفي وتعزيز دور مصر في نشر المعرفة.", "برز في مصر مؤرخون لتدوين تاريخ المجتمع وتحليله مثل المقريزي وابن إياس."]}, {"t": "التحول العمراني والحضاري", "b": ["أسس عمرو بن العاص مدينة الفسطاط لتكون مركزًا للحكم والإدارة لاعتبارات عسكرية وإقتصادية.", "أنشأ أحمد بن طولون مدينة القطائع لتكون مقرًا للحكم ومركِزًا سياسيًا للدولة الطولونية.", "أسهمت العواصم الإسلامية في تنظيم الحكم وتطوير التجارة ودمج السكان في مجتمع حضري.", "شملت ملامح عمران المدن بناء مساجد ومساكن للجند وأسواق وخانات ومؤسسات وقلاع.", "أسس الفاطميون مدينة القاهرة لتكون عاصمة لدولتهم وتحولت لمركز رئيسي بالعالم الإسلامي.", "شهدت القاهرة في العصر المملوكي ازدهار المساجد والمدارس والأسواق والقصور الحكومية.", "أصبحت القاهرة نموذجًا للمدينة الإسلامية الكبرى وجذبت العلماء والتجار والطلاب.", "أدى التطور العمراني إلى تنشيط الحياة الاقتصادية والاجتماعية والثقافية وتدعيم الاستقرار."]}, {"t": "التحول الاقتصادي في مصر خلال العصر الوسيط (1)", "b": ["وفرت الزراعة الموارد اللازمة لتمويل الإدارة والجيش واستقرار الدولة اقتصاديًا وسياسيًا.", "شكلت الزراعة الركيزة الأساسية للاقتصاد بفضل تنظيم الري وإنشاء مقياس النيل.", "أدى استخدام القنوات والسواقي والمصارف إلى زيادة الإنتاج وتنوع المحاصيل لدعم الأمن الغذائي.", "تنوعت المحاصيل الزراعية بين القمح والشعير والكتان لتوفير فائض للتصدير.", "ازدهرت صناعة النسيج وإنتاج الملابس والأقمشة اعتمادًا على زراعة الكتان."]}, {"t": "التحول الاقتصادي في مصر خلال العصر الوسيط (2)", "b": ["تنوعت الصناعات التقليدية بشمل صناعة السكر من القصب وصناعة الأواني والزخارف الزجاجية.", "دعم الازدهار الصناعي التجارة الداخلية والخارجية ووفر فرص عمل بالمدن.", "أصبحت مصر مركزًا تجاريًا يربط بين الشرق والغرب بموقعها بين آسيا وإفريقيا وأوروبا.", "أسهم وجود الموانئ النهرية والبحرية وازدهار الأسواق في جذب التجار وتنشيط الاقتصاد.", "اعتمدت حركة الأسواق التجارية في القاهرة على تداول الذهب والفضة بين التجار."]}, {"t": "مكانة مصر الإقليمية والدولية في العصر الوسيط", "b": ["أصبحت مصر قاعدة عسكرية مهمة لحماية حدود الدولة الإسلامية.", "مثلت مصر مركزًا رئيسيًا للإمدادات الاقتصادية والغذائية للدولة الإسلامية.", "شكلت مصر حلقة وصل أساسية بين طرق التجارة في البحر المتوسط والبحر الأحمر."]}, {"t": "أهم النقاط التي يجب تذكرها (الدرس الثالث)", "b": ["تحولت مصر عام 641م من ولاية بيزنطية إلى ولاية إسلامية مركزية.", "قسم الاستقلال السياسي بمصر إلى دول مستقلة مع الاعتراف بالتبعية الاسمية للدولة العباسية ودولة فاطمية مستقلة تماماً.", "مثلت القاهرة الفاطمية والعصران الأيوبي والمملوكي ذروة القيادة السياسية والحرب بدحر الصليبيين والمغول.", "ضمت الدولة العثمانية مصر عام 1517م ولقبتها بـ «درة التاج العثماني».", "أدى تعريب الدواوين والهجرات العربية إلى صبغ المجتمع بالهوية العربية الإسلامية.", "لعب العلماء والفقهاء دور الوسيط بين السلطة والشعب لحفظ استقرار المجتمع.", "شكل مسجد عمرو بن العاص والجامع الأزهر النواة الأولى للتعليم والسيادة الفكرية.", "ساهمت حركة الترجمة وتأليف المؤرخين كالمقريزي وابن إياس في الإثراء الحضاري.", "تعاقب بناء العواصم الإسلامية بدءًا من الفسطاط ثم القطائع وصولاً إلى القاهرة.", "قام الاقتصاد المصري على الري المنظم بمقياس النيل والصناعات التقليدية كالنسيج والسكر.", "اكتسبت مصر موقعًا تجاريًا وعسكريًا محوريًا يربط أقاليم الشرق والغرب."]}, {"t": "نواتج تعلم الدرس الثالث (1): السياسة والمجتمع", "b": ["ترتكز هوية مصر بعد عام 641م على التحول الجيوسياسي الكامل من التبعية البيزنطية إلى الولاية الإسلامية.", "تكتسب مصر مكانتها التاريخية كولاية فاعلة ومؤثرة في توجيه سياسات وتوازنات النظام الإسلامي العام.", "ارتبط ظهور الدول المستقلة في العصر العباسي الثاني بتراجع الهيبة المركزية للخلافة وحتمية البعد الجغرافي.", "يمثل الاستقلال الاسمي ذكاءً سياسياً يجمع بين السيادة الإدارية الفعلية والتبعية الروحية للخلافة، بعكس قيام الدولة الفاطمية الذي يعد تحولاً في مركز الثقل السياسي بتأسيس سيادة دولية كاملة من القاهرة.", "ترتكز شروط جمع الجزية على العدالة الضريبية والمرونة المالية عبر ربطها بالقدرة الإنتاجية (فيضان النهر).", "يعكس التحول الاجتماعي لمصر قدرة الحضارة الإسلامية على الصهر والدمج الثقافي للمجتمعات متعددة اللغات.", "يشكل التلاحم بين تعريب الإدارة وازدهار المراكز العلمية بالفسطاط والقاهرة الركيزة لتكامل الهوية العربية.", "تمثل الهجرات العربية عاملاً ديموغرافياً حاسماً أسهم في إعادة تشكيل البنية المجتمعية وصهر الهوية المصرية."]}, {"t": "نواتج تعلم الدرس الثالث (2): اللغة والعلماء", "b": ["يعد استقرار القبائل العربية بـ (الفسطاط والدلتا والصعيد) محركاً أساسياً لتحقيق الدمج الثقافي واللغوي مع السكان المحليين.", "يعكس تولي المهاجرين العرب وظائف الحكم والإدارة التحول التدريجي في النخبة السياسية والعسكرية لمصر الإسلامية.", "يبرهن التاريخ على أن انتشار اللغة العربية بمصركان عملية تدريجية ناتجة عن التفاعل المجتمعي لا بقرارات فوقية مفاجئة.", "تؤكد أطروحة ابن خلدون أن لغة الشعوب تتبع غالباً اللسان الثقافي والسياسي للأمة الغالبة والمؤثرة حضارياً.", "تعكس مقاومة المصريين للغات الفرس والروم قوة وصلابة الشخصية الحضارية المصرية أمام لغات القوة والاحتلال العسكري.", "ارتبط تقبل المصريين للسان العربي بالاندماج العقائدي والاجتماعي والتفاعل المؤسسي داخل دواوين الدولة الرسمية.", "يمثل العلماء والفقهاء النخبة التكنوقراطية والشرعية التي أدارت الشئون الحياتية والسياسية للمجتمع بشكل غير مباشر.", "يعكس دور القضاة والعلماء مفهوم «حلقة الوصل القانونية» لضمان التوازن والاستقرار بين السلطة الحاكمة والقاعدة الشعبية.", "شكلت المراكز العلمية بالفسطاط والقاهرة الركائز البنيوية لتأسيس «الدولة القائدة» فكرياً وثقافياً في العالم الإسلامي.", "يتجاوز دور المؤسسات الفقهية البُعد الديني ليمثل أداة لصياغة الوعي الفكري والتماسك الاجتماعي للأمة."]}], "4": [{"t": "التحول السياسي والصدمة الحضارية", "b": ["يمثل تاريخ مصر الحديث مسارًا من التحولات للبحث عن الاستقلالية.", "كشفت الحملة الفرنسية (1798-1801م) عن حجم الفجوة الحضارية بين مصر وأوروبا.", "ظهرت الفجوة الحضارية في مجالات التنظيم العسكري والإدارة الحديثة والعلوم والتقنيات.", "مثلت الحملة الفرنسية صدمة حضارية دفعت المصريين للتفكير في أسباب التقدم الأوروبي.", "برزت شخصية محمد علي (1805-1848م) في أعقاب خروج الحملة الفرنسية واضطراب الأحوال."]}, {"t": "مشروع محمد علي لبناء الدولة الحديثة", "b": ["بنى محمد علي دولة قوية قائمة على جيش نظامي حديث وإدارة مركزية.", "طور محمد علي الزراعة والصناعة وأرسل البعثات العلمية إلى أوروبا.", "تحولت مصر تدريجيًا في عهد محمد علي من ولاية عثمانية إلى كيان سياسي أكثر استقلالاً.", "وثق المؤرخ الجبرتي خطوات محمد علي لبناء مصر بموضوعية رغم معارضته لبعض سياساته.", "تولى محمد علي الحكم وبدأ بتثبيت أركان الدولة والسيطرة على الإدارة والجيش.", "أدخل محمد علي نظامًا جديدًا للجيش يعتمد على التدريب والانضباط بدلاً من الجند التقليديين.", "نظم محمد علي الري وشجع زراعة محاصيل محددة تخدم الدولة.", "أنشأ محمد علي ورشًا ومصانع للسلاح والنسيج لخدمة الجيش والدولة.", "اهتم محمد علي بإرسال البعثات الخارجية لاكتساب الخبرات الحديثة.", "لم يكن خلفاء محمد علي (عباس وسعيد) على نفس كفاءته الإصلاحية حتى تولى إسماعيل."]}, {"t": "من التحديث إلى التبعية والاحتلال البريطاني", "b": ["حصل إسماعيل باشا على فرمان عثماني يغير نظام وراثة الحكم لأكبر أبنائه.", "حصل إسماعيل باشا عام 1867م على لقب الخديو مما منح مصر وضعًا سياسيًا أكثر استقلالاً.", "تزامن اقتراب مصر من الاستقلال السياسي مع تزايد النفوذ الأوروبي والديون الخارجية.", "تزايد النفوذ الأجنبي بسبب مشروعات التنمية الاقتصادية وافتتاح قناة السويس عام 1869م.", "تولى الخديو توفيق الحكم بعد عزل الخديو إسماعيل وزاد في عهده التدخل الأجنبي.", "تصاعدت حركة المقاومة الوطنية ضد التدخل الأجنبي والحكم المطلق أواخر القرن التاسع عشر."]}, {"t": "التحول الاقتصادي والتصنيع المبكر", "b": ["انتقلت مصر من اقتصاد الاكتفاء الذاتي إلى اقتصاد تصديري مرتبط بالسوق العالمية.", "حاول محمد علي بناء اقتصاد صناعي مستقل بإنشاء مصانع أسلحة وغزل ونسيج.", "وفر محمد علي الحماية الجمركية لدعم الصناعة الوطنية.", "الاحتكار: سيطرة الدولة على الإنتاج والتجارة بهدف تنظيم الاقتصاد وزيادة الموارد.", "تراجع مشروع التصنيع بسبب معاهدة بلطة ليمان 1838م التي نصت على إلغاء نظام الاحتكار.", "فتحت معاهدة بلطة ليمان الأسواق المصرية أمام المنتجات الأوروبية مما أدى لتراجع الصناعة المحلية."]}, {"t": "التدخل الأجنبي والاقتصاد في ظل الاحتلال", "b": ["تزايدت الديون الخارجية في النصف الثاني من القرن 19 نتيجة مشروعات التحديث وزيادة الإنفاق.", "ترتب على أزمة الديون إنشاء صندوق الدين وفرض المراقبة الثنائية الأوروبية.", "تم تشكيل وزارة مختلطة تضم وزراء مصريين وأجانب للسيطرة على المالية.", "فقدت مصر جزءًا كبيرًا من استقلالها المالي والسياسي قبل الاحتلال.", "اتخذت بريطانيا من أزمة الديون وتأمين قناة السويس ذريعة لاحتلال مصر 1882م.", "اعتمد الاقتصاد المصري إبان الاحتلال البريطاني على تصدير المواد الخام واستيراد السلع المصنعة.", "سيطر رأس المال الأجنبي على قطاعات حيوية كالبنوك والخدمات الكبرى أثناء الاحتلال.", "وجه الاحتلال الإنتاج لتلبية احتياجات الأسواق العالمية ليصبح الاقتصاد تابعًا للرأسمالية الأوروبية."]}, {"t": "التحولات الاجتماعية والديموغرافية", "b": ["تكونت الطبقة الأولى اجتماعيًا من الحاكم والحاشية والرأسماليين وكبار ملاك الأراضي.", "شملت الطبقة الثانية كبار التجار وأصحاب المصانع والمحامين والأطباء والصحفيين والمثقفين.", "ضمت الطبقة الثالثة الحرفيين وصغار التجار وصغار الملاك في الريف.", "تكونت الطبقة الدنيا من الفلاحين والعمال الموسميين الذين شكلوا أغلبية المجتمع.", "تحولت الأرض الزراعية في القرن 19 إلى سلعة للتجارة وصار القطن هو الذهب الأبيض.", "أدى زيادة ثراء كبار الملاك وهجرة الفلاحين للمدن إلى ظهور أولى العشوائيات حول القاهرة.", "التحول الديموغرافي: التغير الجذري في بنية السكان حجمًا وتوزيعًا وعمرًا ومهنة.", "شهدت مصر نموًا سكانيًا متسارعًا نتيجة تحسن الأوضاع الصحية والاستقرار السياسي.", "تسبب سوء أحوال الفلاحين ونظام الاحتكار في الهجرة من الريف إلى القاهرة والإسكندرية ومدن القناة.", "تغير التركيب المهني للسكان مع ظهور وظائف جديدة مرتبطة بالدولة الحديثة.", "دعا مفكرون مثل رفاعة الطهطاوي وقاسم أمين إلى تعليم الفتيات."]}, {"t": "المرأة والتحول الاجتماعي", "b": ["برزت عائشة التيمورية كرائدة في العمل الثقافي والاجتماعي.", "ظل تحول أوضاع المرأة محدودًا في المدن والنخبة بينما استمرت ريفيات مصر في ظروف تقليدية."]}, {"t": "التيارات الفكرية ومكانة مصر الإقليمية", "b": ["نشأت التيارات الفكرية نتيجة انتشار التعليم وعودة المبتعثين والاحتكاك بالحضارة الأوروبية.", "قاد تيار الإصلاح الديني جمال الدين الأفغاني ومحمد عبده ورشيد رضا.", "قام تيار الإصلاح الديني على تنقية الفكر من الخرافات والجمود وإعمال العقل والاستفادة من الغرب.", "دعا تيار الإصلاح الديني إلى مقاومة الاستبداد السياسي وإقامة العدل والشورى مع التمسك بالهوية.", "برز التيار الليبرالي مع مفكرين مثل أحمد لطفي السيد ورفاعة الطهطاوي.", "ركز التيار الليبرالي على الحريات الفردية والدستور والحياة النيابية على النمط الأوروبي.", "المواطنة: تعني أن جميع المواطنين متساوون في الحقوق والواجبات.", "ظهر تيار الحركة الوطنية كرد فعل مباشر على الاحتلال البريطاني.", "رفع تيار الحركة الوطنية شعارات تحقيق الاستقلال وإنهاء الاحتلال وبناء دولة ذات سيادة.", "من أبرز رموز تيار الحركة الوطنية مصطفى كامل ومحمد فريد.", "تحولت مصر في القرن 19 إلى قوة إقليمية بسطت نفوذها لحماية حدودها كإمبراطورية مستقلة.", "اصطدمت مصر بالقوى الاستعمارية وتلقّت ضربة قاصمة عام 1840م أعادتها لحدودها.", "اعتبرت بريطانيا مصر أهم مستعمراتها للتحكم في قناة السويس وطريق الهند."]}, {"t": "أهم النقاط التي يجب تذكرها (الدرس الرابع)", "b": ["شكلت الحملة الفرنسية (1798م) صدمة حضارية نبهت المصريين لضرورة التحديث والتطوير.", "أسس محمد علي (1805-1848م) الدولة الحديثة باعتماده على الجيش والتعليم والاحتكار الاقتصادي.", "أدى إلغاء نظام الاحتكار بموجب معاهدة بلطة ليمان (1838م) إلى فتح الأسواق وتراجع الصناعة الوطنية.", "تسبب الانفاق المالي والديون الخارجية في عهد إسماعيل في فقدان الاستقلال المالي والسيادة السياسية.", "شكل افتتاح قناة السويس عام 1869م محطة مفصلية جعلت مصر بؤرة للصراع والاستعمار الدولي.", "شهد المجتمع تحولات ديموغرافية وهجرة ريفية أدت لظهور العشوائيات وتغير في التركيب الطبقي.", "توزّع الوعي الفكري الحديث بين تيار الإصلاح الديني، والتيار الليبرالي، وتيار الحركة الوطنية.", "أكد تاريخ مصر أن الضعف الداخلي والديون هما المدخل الرئيسي للسيطرة والاحتلال الأجنبي."]}, {"t": "نواتج تعلم الدرس الرابع (1): الصدمة الحضارية ومحمد علي", "b": ["كشفت الحملة الفرنسية للمصريين حجم الفجوة مع أوروبا نتيجة الصدمة الحضارية.", "نجح محمد علي في استغلال الفراغ السياسي بعد خروج الفرنسيين لتثبيت حكمه لمصر.", "أدرك المصريون ضعف التنظيم العسكري للمماليك وإدارتهم التقليدية بسبب الفجوة الحضارية.", "برزت شخصية محمد علي كقائد ذكي ومختار شعبيًا وسط الاضطرابات والسياسة الداخلية.", "ارتبط تطوير الزراعة والصناعة في مصر الحديثة بالتنمية الاقتصادية الشاملة.", "تغيرت مكانة مصر الإقليمية والدولية نتيجة الطموح التوسعي لمحمد علي.", "أعاد المصريون التفكير في أسباب تقدم الغرب بعد اكتشاف العلوم والتقنيات الحديثة.", "اتسع الخلاف بين القاهرة والآستانة تدريجيًا بسبب ضعف السيادة العثمانية.", "تميز مشروع محمد علي عن المحاولات السابقة بفضل إنشاء جيش نظامي حديث.", "اعتمد محمد علي على التعليم والجيش والنظام المركزي في بناء الدولة الحديثة.", "تحولت مصر تدريجيًا من مجرد ولاية تابعة إلى كيان سياسي مستقل.", "اختلف وضع مصر المعزول عن العالم قبل عام 1798 عن وضعها بعد الانفتاح على العالم.", "اتضح طموح محمد علي العسكري من خلال حروبه التي شكلت طبيعة العلاقة مع السلطان."]}, {"t": "نواتج تعلم الدرس الرابع (2): الهوية وبناء الدولة", "b": ["يقع العبء المشترك على عاتق الشعب والحاكم معًا في حماية هوية الدولة.", "يظهر وعي المجتمعات ونهضتها المعاصرة من خلال تقدير العلم والعلماء والبعثات التعليمية.", "يتطلب استقرار الأوطان وحمايتها من الأخطار استشعار المسؤولية التاريخية المشتركة.", "يتأكد دور الشباب والعلماء في نقل المعرفة عبر ادراك أهمية الانفتاح العلمي.", "ارتبط نجاح محمد علي في إنهاء الفوضى السياسية بـتثبيت أركان الدولة وسلطتها.", "اعتمدت القوة العسكرية الجديدة على التدريب والانضباط بدلاً من الجند التقليديين والمرتزقة.", "استهدف تنظيم الري وتوجيه المحاصيل الزراعية خدمة السياسة الاقتصادية للدولة.", "ارتبط تأسيس ورش السلاح ومصانع النسيج مباشرة بـتحقيق الاكتفاء الذاتي العسكري.", "تباينت قدرة حكام أسرة محمد علي في إدارة البلاد بسبب اختلاف الكفاءة الإصلاحية لهم.", "اعتبر محمد علي القوة العسكرية الأداة الأساسية لحماية وتمرير المشروع الإصلاحي والتحديثي.", "تكشف الصدامات العسكرية لمحمد علي والتوسع الإقليمي طبيعة العلاقة المعقدة مع السلطان العثماني.", "يظهر الفارق بين القوة والضعف في تاريخ مصر عند المقارنة بين عصر محمد علي وخلفائه (عباس وسعيد).", "تتطلب مواجهة التحديات والأخطار الداخلية تكاتف الجميع لاستشعار المسؤولية التاريخية وحماية الكيان.", "يتأكد دور العلم في بناء الأوطان واللحاق بالغرب من خلال أهمية إرسال البعثات العلمية."]}, {"t": "نواتج تعلم الدرس الرابع (3): الخديو إسماعيل والديون", "b": ["منح لقب الخديو وتغيير نظام وراثة العرش حاكم مصر وضعًا سياسيًا أكثر استقلالاً.", "تزامنت محاولات التحديث العمراني والاقتصادي في عهد إسماعيل مع تزايد النفوذ والتدخل الأوروبي.", "تضاعفت الأهمية الإستراتيجية للموقع الجغرافي لمصر بعد افتتاح قناة السويس للملاحة العالمية.", "ارتبطت أزمة الديون الأجنبية والتدخل الاستعماري بالانتقال إلى الاقتصاد التصديري والأسواق العالمية.", "يظهر التناقض بين مظاهر السيادة الرسمية والواقع المالي من خلال المفارقة بين الاستقلال السياسي والتبعية الاقتصادية.", "تزايدت الأطماع الدولية في مصر بناءً على الأهمية الجيوسياسية لقناة السويس.", "هناك رابط بين عجز الدولة عن سداد التزاماتها المالية والاطماع الخارجية في البلاد.", "أن الحفاظ على حرية الأوطان يتطلب بالدرجة الأولى حماية الاستقلال المالي والاقتصادي.", "استهدفت السياسة الجمركية لمحمد علي دعم السلع المحلية وتطوير الاقتصاد الصناعي المستقل.", "تجسد التدخل الأجنبي في شؤون مصر المالية من خلال فرض المراقبة الثنائية وتشكيل الوزارة المختلطة.", "اتخذت بريطانيا من حماية مصالح الدائنين وتأمين قناة السويس ذريعة وحجة لاحتلال مصر عسكريًا.", "انهار المشروع الصناعي نتيجة التفاعل بين الضغوط الخارجية والسياسات الداخلية.", "تزايد حجم القروض الخارجية والإنفاق الحكومي كسبب رئيسي لأزمة الديون والتدخل الأجنبي.", "سقطت آليات التحكم في الإنتاج والتجارة نتيجة إلغاء الحماية الجمركية للدولة.", "تشجيع واقتناء المنتجات المحلية جزء من واجب دعم الصناعة الوطنية.", "تجنب الاعتماد على القروض الخارجية كشرط أساسي لحماية الأمن القومي الاقتصادي."]}, {"t": "نواتج تعلم الدرس الرابع (4): الاقتصاد والمجتمع والتيارات", "b": ["تحويل مصر إلى مزرعة لتوفير المحاصيل للاقتصاد الإنجليزي نتيجة الاعتماد على تصدير المواد الخام.", "تحجيم وتراجع حركة التصنيع الوطنية داخل البلاد نتيجة استيراد السلع المصنعة والأجنبية.", "تراجع السيادة المالية الوطنية على القطاعات الحيوية والمرافق نتيجة سيطرة رأس المال الأجنبي على البنوك والخدمات.", "ربط عجلة الإنتاج الزراعي بمتطلبات الخارج وليس باحتياجات الشعب نتيجة التبعية للرأسمالية الأوروبية.", "انقسام المجتمع إلى فئات متباينة النفوذ والملكية نتيجة التفاوت واتساع الفجوة الطبقية.", "رفض السياسات التجارية الاستعمارية وحظر التبعية شرط لحماية الأمن الاقتصادي القومي.", "مساندة ودعم الفئات الكادحة والعمالية جزء من ترسيخ قيم العدالة الاجتماعية.", "ارتفاع معدلات الإنجاب وانخفاض الوفيات نتيجة النمو السكاني المتسارع بسبب تحسن الصحة والاستقرار.", "ترك القرى والتوجه صوب القاهرة والإسكندرية ومدن القناة نتيجة سوء أحوال الفلاحين والهجرة من الريف إلى المدن.", "نشأت تخصصات وأعمال جديدة تابعة للوظائف الحكومية لتغير التركيب المهني للسكان في الدولة الحديثة.", "تغير بنية المجتمع من حيث الحجم والتوزيع والمهن كأبرز مظاهر التحول الديموغرافي.", "بداية خروج الفتيات للمدارس والعمل الثقافي بفضل دعوات رفاعة الطهطاوي وقاسم أمين وعائشة التيمورية.", "انحصار النهضة النسوية داخل المدن وبين النخبة كمؤشر على محدودية تحول أوضاع المرأة المصرية.", "تحرير العقل ومحاربة الجمود ومقاومة الاستبداد مع التمسك بالهوية هدف تيار الإصلاح الديني للأفغاني ومحمد عبده.", "المطالبة بالحريات الفردية والدستور والحياة النيابية على النمط الأوروبي أبرز ركائز التيار الليبرالي لأحمد لطفي السيد والطهطاوي.", "المساواة الكاملة بين جميع أبناء الشعب في الحقوق والواجبات أهم مبادئ مفهوم المواطنة.", "السعي لإنهاء الوجود البريطاني وبناء دولة ذات سيادة هدف أصيل لـتيار الحركة الوطنية لمصطفى كامل ومحمد فريد.", "الدعوة لتعليم الفتيات على يد رفاعة الطهطاوي وقاسم أمين بداية لتحول أوضاع المرأة المصرية.", "ظهور رائدات في العمل الثقافي والاجتماعي متمثلاً في إسهامات عائشة التيمورية.", "التوسع لحماية الحدود وبناء قوة عسكرية ضخمة سبب رئيسي في تحول مصر إلى قوة إقليمية.", "تحالف الدول الأوروبية ضد محمد علي وفرض معاهدة لندن مثال على التصادم مع النفوذ الاستعماري.", "تصنيف التيارات الفكرية في القرن التاسع عشر (دينية، ليبرالية، وطنية) تبعا لمناهج التحديث وموقفها من الغرب."]}]};

function dkey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function touchDay(){var t=dkey(),D=S.days;if(D.last===t)return;var y=new Date();y.setDate(y.getDate()-1);D.n=(D.last===dkey(y))?D.n+1:1;D.last=t;D.best=Math.max(D.best||0,D.n);var b={3:300,7:700,14:1500,30:3000}[D.n];if(b){S.extra+=b;toast('🔥 '+D.n+' أيام ورا بعض! مكافأة +'+b+' ⭐');SFX.unlock()}save();hdr()}

function seedRand(s){return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

 }});

function vcode(s){s='MN-nasr-26|'+s;var a=0x811c9dc5,b=0x9e3779b9;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,16777619)>>>0;b=(Math.imul(b^c,2246822519)+((a>>>13)|(a<<19)))>>>0}var t=(a.toString(36)+b.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,'');while(t.length<8)t+='7';return t.slice(0,4)+'-'+t.slice(4,8)}

/* ============ محرك الأسئلة ============ */
function runQuiz(o){
 var qs=o.qs.map(function(q){return {q:q.q,opts:shuffle(q.o.map(function(t,k){return {t:t,ok:k===0}}))}});
 var n=qs.length,i=0,cor=0,pts=0,streak=0,locked=false,t0=0,mark=[],hint20=false,hint5=false,lastTick=99;
 function dots(){var h='';for(var k=0;k<n;k++)h+='<i class="'+(mark[k]||(k===i?'cur':''))+'"></i>';return h}
 function show(){
  var q=qs[i];locked=false;hint20=hint5=false;lastTick=99;
  var h='<div class="qwrap"><div class="qtop"><button class="xb" onclick="quizExit()">🚪 خروج</button><div class="tl">'+esc(o.title)+'</div><div class="chip y" id="qp">⭐ '+pts+'</div></div>';
  h+='<div style="text-align:center;font-size:13px;color:#a8a8a8">سؤال '+(i+1)+' من '+n+'</div><div class="dots">'+dots()+'</div>';
  h+='<div class="timer" id="tm"><i id="tb"></i><b class="kn" id="kn"></b><span id="tt">'+QTIME+'</span></div>';
  h+='<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  q.opts.forEach(function(op,k){h+='<button class="op" data-k="'+k+'"><span class="l">'+'أبجد'[k]+'</span><span>'+esc(op.t)+'</span></button>'});
  h+='</div><div class="fb" id="fb">'+tTxt()+'</div><button class="btn big hide" id="nx">'+(i===n-1?'شوف النتيجة 🏁':'السؤال التالي ◀')+'</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  var bs=app.querySelectorAll('.op');for(var b=0;b<bs.length;b++)bs[b].onclick=function(){answer(+this.getAttribute('data-k'))};
  document.getElementById('nx').onclick=function(){SFX.click();i++;if(i>=n){clearT();o.onFinish({correct:cor,total:n,pts:pts})}else show()};
  SFX.whoosh();clearT();t0=Date.now();
  curT=setInterval(function(){
   var el=(Date.now()-t0)/1000,rem=Math.max(0,QTIME-el);
   var tb=document.getElementById('tb');if(!tb){clearT();return}
   tb.style.width=(rem/QTIME*100)+'%';var kn=document.getElementById('kn');if(kn)kn.style.right=(rem/QTIME*100)+'%';tb.style.background=rem>QTIME/2?'#22c55e':(rem>QTIME/4?'#ffe600':'#ef4444');
   document.getElementById('tt').textContent=Math.ceil(rem);
   document.getElementById('tm').className='timer'+(rem<=QTIME/6?' low':'');
   var c=Math.ceil(rem);if(c!==lastTick&&c>0){if(rem<=Math.min(5,QTIME/6)){lastTick=c;SFX.beep()}else if(rem<=QTIME/3){lastTick=c;SFX.heart()}}
   if(!hint20&&rem<=QTIME/3){hint20=true;hint(rnd(P.hurry20))}
   if(!hint5&&rem<=QTIME/6){hint5=true;hint(rnd(P.hurry5))}
   if(rem<=0)timeout();
  },100);
 }
 function hint(t){if(locked)return;var f=document.getElementById('fb');if(f)f.innerHTML='<span style="color:#ffe600">'+t+'</span>';say(t)}
 function reveal(sel){var bs=app.querySelectorAll('.op');var q=qs[i];for(var b=0;b<bs.length;b++){bs[b].disabled=true;if(q.opts[b].ok)bs[b].className='op right';else if(b===sel)bs[b].className='op wrong'}}
 function after(){document.getElementById('nx').classList.remove('hide');document.getElementById('qp').textContent='⭐ '+pts;var d=document.querySelector('.dots');if(d)d.innerHTML=dots()}
 function answer(k){
  if(locked)return;locked=true;clearT();var el=(Date.now()-t0)/1000;var ok=qs[i].opts[k].ok;reveal(k);
  var fb=document.getElementById('fb');
  if(o.fix){if(ok){delete S.mist[qs[i].q];save()}}else if(!ok)recMist(qs[i]);
  if(ok){var p=tier(el);cor++;streak++;pts+=p;mark[i]='ok';
   var msg=el<=QTIME/6?rnd(P.fast):rnd(P.ok);var extra='';
   if(streak===3)extra=P.st3;if(streak===5)extra=P.st5;if(streak===8)extra=P.st8;if(streak===3||streak===5||streak===8)setTimeout(SFX.combo,500);setTimeout(SFX.coin,350);
   fb.innerHTML=msg+'<small>+'+p+' نقطة'+(extra?' • '+extra:'')+'</small>';(el<=QTIME/6?SFX.fast:SFX.right)();say(msg);
  }else{streak=0;mark[i]='no';var m=rnd(P.bad);fb.innerHTML=m+'<small style="color:#ef4444">0 نقطة</small>';SFX.wrong();say(m)}
  after();
 }
 function timeout(){
  if(locked)return;locked=true;clearT();streak=0;mark[i]='no';reveal(-1);if(!o.fix)recMist(qs[i]);SFX.time();var m=rnd(P.time);document.getElementById('fb').innerHTML=m+'<small style="color:#ef4444">0 نقطة</small>';say(m);after();
 }
 window.quizExit=function(){askExit('تخرج من التحدي؟ هتخسر تقدمك فيه!',function(){clearT();o.onExit()})};
 show();
}

/* ============ محرك المغامرات ============ */
function runAdv(o){
 var items=o.items,n=items.length,i=0,good=0,mark=[];
 function dots(){var h='';for(var k=0;k<n;k++)h+='<i class="'+(mark[k]||(k===i?'cur':''))+'"></i>';return h}
 function frame(inner){return '<div class="qwrap"><div class="qtop"><button class="xb" onclick="quizExit()">🚪 خروج</button><div class="tl">'+esc(o.title)+'</div><div class="chip y">💎 '+Math.round(good*100)+'</div></div><div style="text-align:center;font-size:13px;color:#a8a8a8">مهمة '+(i+1)+' من '+n+'</div><div class="dots">'+dots()+'</div>'+inner+'<div class="fb" id="fb"></div><button class="btn big hide" id="nx">'+(i===n-1?'نهاية المغامرة 🏁':'المهمة التالية ◀')+'</button></div>'}
 window.quizExit=function(){askExit('تخرج من المغامرة؟ هتخسر تقدمك فيها!',function(){o.onExit()})};
 function done(ok,note,fr){
  if(!ok)good+=(fr||0);
  if(ok){good++;mark[i]='ok';SFX.right();var m=rnd(P.advok);document.getElementById('fb').innerHTML=m+(note?'<small>'+note+'</small>':'');say(m)}
  else{mark[i]='no';SFX.wrong();var m2=rnd(P.advbad);document.getElementById('fb').innerHTML=m2+(note?'<small>'+note+'</small>':'');say(m2)}
  var d=document.querySelector('.dots');if(d)d.innerHTML=dots();
  var nx=document.getElementById('nx');nx.classList.remove('hide');nx.onclick=function(){SFX.click();i++;if(i>=n)o.onFinish({correct:Math.round(good*10)/10,total:n,pts:Math.round(good*100)});else go()};
 }
 function go(){
  var it=items[i];window.scrollTo(0,0);
  if(it.t==='tf'){
   app.innerHTML=frame('<div class="qtext">'+esc(it.s)+'</div><div class="opts"><button class="op" id="y"><span class="l">✔</span>صح</button><button class="op" id="x"><span class="l">✖</span>خطأ</button></div>');
   var fin=false;function pick(v){if(fin)return;fin=true;var ok=v===it.a;document.getElementById('y').disabled=document.getElementById('x').disabled=true;document.getElementById(it.a?'y':'x').className='op right';if(!ok)document.getElementById(v?'y':'x').className='op wrong';done(ok,it.w)}
   document.getElementById('y').onclick=function(){pick(true)};document.getElementById('x').onclick=function(){pick(false)};
  }
  if(it.t==='blank'){
   var parts=it.s.split('___');
   app.innerHTML=frame('<div class="qtext">'+esc(parts[0])+'<span class="gap" id="gp">؟؟؟</span>'+esc(parts[1]||'')+'</div><div class="chips" id="cs"></div>');
   var cs=document.getElementById('cs');var fin2=false;
   shuffle(it.o).forEach(function(t){var b=document.createElement('button');b.className='cp';b.textContent=t;b.onclick=function(){if(fin2)return;fin2=true;SFX.click();var ok=t===it.a;document.getElementById('gp').textContent=it.a;b.style.borderColor=ok?'#22c55e':'#ef4444';b.style.background=ok?'#14532d':'#5b1111';done(ok,ok?'':'الإجابة الصح: '+it.a)};cs.appendChild(b)});
  }
  if(it.t==='match'){
   var left=it.p.map(function(p,k){return {t:p[0],k:k}}),right=shuffle(it.p.map(function(p,k){return {t:p[1],k:k}}));
   var h='<div style="text-align:center;font-weight:900;margin:8px 0">'+esc(it.s)+'</div><div class="mt"><div class="cl" id="lc"></div><div class="cl" id="rc"></div></div>';
   app.innerHTML=frame(h);var sel=null,mist=0,m=0;
   var lc=document.getElementById('lc'),rc=document.getElementById('rc');
   left.forEach(function(x){var b=document.createElement('button');b.className='mc';b.textContent=x.t;b.onclick=function(){SFX.pop();[].forEach.call(lc.children,function(c){c.classList.remove('sel')});b.classList.add('sel');sel={k:x.k,el:b}};lc.appendChild(b)});
   right.forEach(function(x){var b=document.createElement('button');b.className='mc';b.textContent=x.t;b.onclick=function(){
    if(!sel){toast('اختار من العمود التاني الأول 👆');return}
    if(sel.k===x.k){b.classList.add('ok');sel.el.className='mc ok';sel=null;SFX.right();m++;if(m===it.p.length)done(mist===0,mist?'غلطت '+mist+' مرة في التوصيل':'',Math.max(0,1-mist*.25))}
    else{mist++;SFX.wrong();b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},450)}
   };rc.appendChild(b)});
  }
  if(it.t==='order'){
   var h2='<div style="text-align:center;font-weight:900;margin:8px 0">'+esc(it.s)+'</div><div style="text-align:center;color:#a8a8a8;font-size:13px">اضغط على العناصر بالترتيب الصحيح</div><div class="ordr" id="sl"></div><div class="chips" id="cs"></div>';
   app.innerHTML=frame(h2);var sl=document.getElementById('sl'),cs2=document.getElementById('cs'),nxt=0,mi=0;
   it.i.forEach(function(){var d=document.createElement('div');d.className='slot';d.textContent='؟';sl.appendChild(d)});
   shuffle(it.i.map(function(t,k){return {t:t,k:k}})).forEach(function(x){var b=document.createElement('button');b.className='cp';b.textContent=x.t;b.onclick=function(){
    if(x.k===nxt){var s=sl.children[nxt];s.className='slot f';s.textContent=(nxt+1)+'. '+x.t;b.classList.add('used');nxt++;SFX.click();if(nxt===it.i.length)done(mi===0,mi?'غلطت '+mi+' مرة في الترتيب':'',Math.max(0,1-mi*.25))}
    else{mi++;SFX.wrong();b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},450)}
   };cs2.appendChild(b)});
  }
 }
 go();

  h+='</div><div style="display:flex;gap:8px;margin-top:14px">'+(i>0?'<button class="btn gh" id="pv">▶ السابق</button>':'')+'<button class="btn" style="flex:1" id="nx">'+(i===N-1?'إنهاء وتسليم 🏁':'التالي ◀')+'</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);tick(true);
  var bs=app.querySelectorAll('.op');for(var b=0;b<bs.length;b++)bs[b].onclick=function(){q.sel=+this.getAttribute('data-k');SFX.click();show()};
  document.getElementById('nx').onclick=function(){
   if(q.sel<0){toast('اختار إجابة الأول 😄');return}

 function tick(silent){

  xb.style.width=(r/EXT*100)+'%';xb.style.background=r>EXT/2?'#22c55e':(r>EXT/6?'#ffe600':'#ef4444');

  if(s!==lastS){lastS=s;
   if(r<=10&&r>0)SFX.beep();else if(r<=60&&r>0)SFX.tick();else if(r<=180&&s%10===0)SFX.heart();
   [[600,'باقي 10 دقايق ⏳'],[300,'باقي 5 دقايق! ركّز ⚡'],[60,'باقي دقيقة واحدة بس! 🔥']].forEach(function(w){if(s===w[0]&&!warned[w[0]]){warned[w[0]]=1;SFX.warn();toast(w[1]);say(w[1])}});

 }
 window.exExit=function(){askExit('تخرج من الاختبار؟ هتفقد إجاباتك والوقت بيفضل يعدّ!',function(){clearT();over=true;openLesson(lid,'ex')})};

   var pr=S.prog[l.id]&&S.prog[l.id][c.id];var played=!!pr;var p=played?pr.pct:0;
   var unlocked=i===0||pctOf(l.id,ch[i-1].id)>=PASS;
   h+='<div class="brw"><div class="nm">'+c.ico+' '+esc(c.name)+'<small>'+(played?'⭐ '+pr.pts+' نقطة':(unlocked?'لسه ما بدأتش':'مقفولة 🔒'))+'</small></div><div class="pc '+pcCls(p,played)+'">'+(played?p+'%':'—')+'</div>'+(unlocked?'<button onclick="startCh('+l.id+',\''+c.id+'\')">'+(played?'🔼 تحسين':'▶ ابدأ')+'</button>':'<button class="d" onclick="lockedMsg()">🔒</button>')+'</div>';
  });
  [1,2].forEach(function(n){var e=exOf(l.id,n);var pc=e?Math.round(e.best/e.total*100):0;
   h+='<div class="brw"><div class="nm">🧪 الشامل '+(n===1?'الأول':'الثاني')+'<small>'+(e?e.best+' من '+e.total+(e.sent?' • تم الإرسال ✅':''):(all?'لسه ما بدأتش':'مقفول 🔒'))+'</small></div><div class="pc '+pcCls(pc,!!e)+'">'+(e?pc+'%':'—')+'</div>'+(all?'<button onclick="startExam('+l.id+','+n+')">'+(e?'🔼 تحسين':'▶ ابدأ')+'</button>':'<button class="d" onclick="lockedMsg()">🔒</button>')+'</div>'});
  h+='</div>';
 });
 view(h);hdr();
}

/* ============ يلااا جولة ============ */
function gawlaHome(){
 var h='<button class="back" onclick="home()">▶ الرئيسية</button><div class="ltitle" style="color:#ff4d8d">⚔️ يلااا جولة</div><div class="box"><p style="line-height:1.9;margin:0 0 10px">نادِ زميلك، يسجل اسمه، وتلعبوا نفس الـ3 أسئلة العشوائية واحد ورا التاني. الأسرع والأذكى يكسب!</p><button class="btn pk big" onclick="newGawla()">🔥 ابدأ جولة جديدة</button></div><h2 class="sec" style="font-size:20px">🏅 سجل الجولات</h2>';
 h+=qtPicker();
 if(!S.gawla.length)h+='<div style="color:#a8a8a8">لسه مفيش جولات. أول جولة مستنياك! 😎</div>';
 S.gawla.slice().reverse().slice(0,20).forEach(function(g){h+='<div class="glog"><div><b>'+esc(g.a)+'</b> ('+g.ap+') ⚔️ <b>'+esc(g.b)+'</b> ('+g.bp+')<div style="font-size:11px;color:#a8a8a8">'+g.d+'</div></div><div class="chip y">'+(g.w==='tie'?'تعادل 🤝':'🏆 '+esc(g.w))+'</div></div>'});
 view(h);hdr();
}
function newGawla(){
 if(!S.name)return ask('اسمك إيه الأول؟','اسمك',function(v){S.name=v;save();newGawla()});
 ask('اسم زميلك إيه؟','اسم الزميل',function(b){
  var pool=[];LESSONS.forEach(function(l){pool=pool.concat(l.bank)});
  var qs=shuffle(pool).slice(0,3);var A=S.name,B=b,ra=null;
  function play(who,cb){runQuiz({title:'يلااا جولة • دور '+who,qs:qs,onExit:gawlaHome,onFinish:cb})}
  play(A,function(r1){ra=r1;
   view('<div class="res"><div style="font-size:60px">🔄</div><h2 style="font-family:Lalezar;font-size:30px;color:#ff4d8d">سلّم الجهاز لـ '+esc(B)+'!</h2><p>'+esc(A)+' جاب '+r1.pts+' نقطة ('+r1.correct+' من 3). يا ترى '+esc(B)+' يقدر يتفوق؟ 😏</p><button class="btn pk big" id="go">أنا جاهز يا '+esc(B)+' 🔥</button></div>');SFX.star();
   document.getElementById('go').onclick=function(){SFX.click();play(B,function(r2){
    var w=ra.pts>r2.pts?A:(r2.pts>ra.pts?B:(ra.correct>r2.correct?A:(r2.correct>ra.correct?B:'tie')));
    S.gawla.push({a:A,b:B,ap:ra.pts,bp:r2.pts,w:w,d:new Date().toLocaleString('ar-EG')});save();
    var line=w==='tie'?'تعادل! محدش يكسب ومحدش يزعل 🤝':'الكاسب: '+esc(w)+' 🏆 — والتاني... يلا ذاكر! 😂';
    view('<div class="res"><div style="font-size:64px">'+(w==='tie'?'🤝':'🏆')+'</div><h2 style="font-family:Lalezar;font-size:32px;color:#ffe600">'+line+'</h2><div class="rrow"><div class="chip">'+esc(A)+': '+ra.pts+' ⭐ ('+ra.correct+'/3)</div><div class="chip">'+esc(B)+': '+r2.pts+' ⭐ ('+r2.correct+'/3)</div></div><div style="display:grid;gap:10px;margin-top:14px"><button class="btn pk big" onclick="newGawla()">⚔️ جولة تانية</button><button class="btn gh big" onclick="gawlaHome()">🏅 سجل الجولات</button></div></div>');
    SFX.win();confetti();say('انتهت الجولة');
   })};
  });
 });
}

/* ============ تشغيل ============ */
document.addEventListener('click',function(){try{ac()}catch(e){}},{once:true});
/* ===== نافذة تحميل التطبيق على الهاتف ===== */
var DIP=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DIP=e;var b=document.getElementById('ibtn');if(b)b.style.display=''});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
function instClose(){var p=document.getElementById('ipop');if(p)p.remove();try{localStorage.setItem('mn_inst',Date.now())}catch(e){}}
function instGo(){if(DIP){DIP.prompt();DIP.userChoice.then(function(){DIP=null;instClose()})}}
function instShow(){
  var sa=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(sa)return;
  if(!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))return;
  try{var t=+localStorage.getItem('mn_inst')||0;if(Date.now()-t<86400000)return}catch(e){}
  var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  var how=ios?'اضغط زر المشاركة <b>⬆️</b> في أسفل المتصفح (Safari) ثم اختار <b>«إضافة إلى الشاشة الرئيسية»</b>.':'اضغط على النقط الثلاث <b>⋮</b> في أعلى المتصفح ثم اختار <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.';
  var d=document.createElement('div');d.className='ipop';d.id='ipop';
  d.innerHTML='<div class="bx"><div class="ic">📲</div><h3>حمّل التطبيق على هاتفك</h3><p>افتح مصر بين الماضي والحاضر زي أي تطبيق من شاشة موبايلك، بسرعة وبدون ما تدور على الرابط كل مرة.</p><button class="btn" id="ibtn" style="display:'+(DIP?'':'none')+';width:100%" onclick="instGo()">⬇️ تحميل التطبيق</button><div class="st" id="ihow" style="margin-top:12px;'+(DIP?'display:none':'')+'">'+how+'</div><a class="lt" href="#" onclick="instClose();return false">مش دلوقتي</a></div>';
  document.body.appendChild(d);
}
setTimeout(instShow,1200);

hdr();
if(!S.name){home();ask('أهلاً بيك يا بطل! 👋<br><span style="font-size:15px;color:#fff">اسمك إيه؟</span>','اكتب اسمك هنا',function(v){S.name=v;save();home()})}
else home();
</script>
